# Use real retained-source manifests; repository-root aliases are for people.
version: 2
updates:
  - package-ecosystem: npm
    directory: /components/legacy-project-wrapper/implementation
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      typescript:
        patterns: [typescript, '@types/*']
      dev-dependencies:
        dependency-type: development
    labels: [dependencies, npm]

  - package-ecosystem: pip
    directories:
      - /components/legacy-project-wrapper/implementation/apps/flight-planner
      - /components/legacy-project-wrapper/implementation/apps/flightschool
      - /components/legacy-project-wrapper/implementation/apps/foreflight-dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, python]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, github-actions]
