name: Dependency Scan

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Dependabot metadata — only meaningful on Dependabot PRs
  dependabot:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v6
      - name: Dependabot Security Update
        uses: dependabot/fetch-metadata@v3.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Trivy filesystem scan — no Docker Hub credentials required
  trivy:
    runs-on: ubuntu-latest
    continue-on-error: true  # non-blocking: finding real CVEs in dependencies we can't patch immediately
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy Vulnerability Scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: 'CVE-2024-29415,GHSA-67mh-4wv8-2f99,GHSA-vg6x-rcgg-rjx6,CVE-2026-31802'
          severity: 'CRITICAL,HIGH'

  # Snyk — requires SNYK_TOKEN secret
  # To enable: add SNYK_TOKEN to repo Settings → Secrets → Actions
  # Get a token at https://app.snyk.io/account
  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true   # non-blocking until SNYK_TOKEN is configured
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # pip-audit for Python dependency CVEs
  pip-audit:
    runs-on: ubuntu-latest
    continue-on-error: true  # non-blocking: suppress on unpatchable transitive CVEs
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install local packages and dependencies
        working-directory: apps/flight-planner
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements.txt
      - name: Run pip-audit
        # Skip local packages (aviation-shared-sdk) — they have no PyPI CVE data
        run: pip-audit --skip-editable
