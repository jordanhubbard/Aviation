name: Dependency Scan

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

defaults:
  run:
    working-directory: components/legacy-project-wrapper/implementation

jobs:
  # Dependabot metadata — only meaningful on Dependabot PRs
  dependabot:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - name: Dependabot Security Update
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Trivy filesystem scan — no Docker Hub credentials required
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy Vulnerability Scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # Snyk — requires SNYK_TOKEN secret
  # To enable: add SNYK_TOKEN to repo Settings → Secrets → Actions
  # Get a token at https://app.snyk.io/account
  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true   # non-blocking until SNYK_TOKEN is configured
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  node-audit:
    name: Node workspace audit (including development tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: components/legacy-project-wrapper/implementation/package.json
      - name: Audit the complete committed workspace lock
        run: pnpm audit --audit-level high

  # pip-audit for Python dependency CVEs
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install local packages and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -e packages/shared-sdk/python
          grep -v '^-e ' apps/flight-planner/requirements.txt >/tmp/flight-planner-requirements.txt
          pip install -r /tmp/flight-planner-requirements.txt
          python -m pip install 'setuptools>=84.1.0'
      - name: Run pip-audit
        # Skip local packages (aviation-shared-sdk) — they have no PyPI CVE data
        run: pip-audit --skip-editable
