name: Common Aviation SDK

on:
  push:
    branches: [main]
    paths:
      - 'components/aviation-*/**'
      - 'components/legacy-project-wrapper/implementation/packages/**'
      - 'components/legacy-project-wrapper/implementation/pnpm-lock.yaml'
      - 'components/legacy-project-wrapper/implementation/go.mod'
      - 'components/legacy-project-wrapper/implementation/go.sum'
      - 'components/legacy-project-wrapper/implementation/scripts/check_workspace_package_graph.py'
      - 'docs/roadmap/workspace-package-graph.json'
      - '.github/workflows/sdk-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'components/aviation-*/**'
      - 'components/legacy-project-wrapper/implementation/packages/**'
      - 'components/legacy-project-wrapper/implementation/pnpm-lock.yaml'
      - 'components/legacy-project-wrapper/implementation/go.mod'
      - 'components/legacy-project-wrapper/implementation/go.sum'
      - 'components/legacy-project-wrapper/implementation/scripts/check_workspace_package_graph.py'
      - 'docs/roadmap/workspace-package-graph.json'
      - '.github/workflows/sdk-ci.yml'

jobs:
  typescript:
    name: TypeScript shared packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/legacy-project-wrapper/implementation
    steps:
      - uses: actions/checkout@v7
      - name: Validate workspace package and build graph
        working-directory: .
        run: python scripts/check_workspace_package_graph.py
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - name: Install service-health Component candidate
        working-directory: components/aviation-service-health/implementation/typescript
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Build service-health Component candidate
        working-directory: components/aviation-service-health/implementation/typescript
        run: pnpm run build
      - name: Test service-health Component candidate
        working-directory: components/aviation-service-health/implementation/typescript
        run: pnpm run test
      - name: Install common SDK dependencies
        run: >-
          pnpm install --frozen-lockfile
          --filter .
          --filter @aviation/keystore...
          --filter @aviation/nav-data...
          --filter @aviation/g1000-avionics-sdk...
          --filter @aviation/g1000-protocols...
          --filter @aviation/g1000-rendering...
          --filter @aviation/ui-framework...
          --filter @aviation/meta-app...
          --filter g1000-simulator-frontend...
          --filter @aviation/g1000-simulator-backend...
      - name: Build common SDK packages
        run: |
          pnpm --filter @aviation/shared-sdk run build
          pnpm --filter @aviation/keystore run build
          pnpm --filter @aviation/ai-explainer run build
          pnpm --filter @aviation/aviation-config run build
          pnpm --filter @aviation/nav-data run build
          pnpm --filter @aviation/g1000-avionics-sdk run build
          pnpm --filter @aviation/g1000-protocols run build
          pnpm --filter @aviation/g1000-rendering run build
          pnpm --filter @aviation/ui-framework run build
          pnpm --filter @aviation/meta-app run build
          pnpm --filter g1000-simulator-frontend run build
      - name: Verify the legacy TypeScript SDK root consumer
        run: pnpm --filter @aviation/g1000-simulator-backend run test
      - name: Install browser for SDK consumer verification
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify rendered settings confirmation and browser-safe SDK consumers
        timeout-minutes: 3
        run: node packages/aviation-config/tests/settings-browser.mjs
      - name: Verify shared explanation UI, follow-ups and request cleanup
        timeout-minutes: 3
        run: node packages/ai-explainer/tests/explanation-browser.mjs
      - name: Test common SDK and Component conformance
        run: |
          pnpm --filter @aviation/keystore run test
          pnpm --filter @aviation/ai-explainer run test
          pnpm --filter @aviation/aviation-config run test
          pnpm --filter @aviation/shared-sdk run test
          pnpm --filter @aviation/nav-data run test
          pnpm --filter @aviation/g1000-avionics-sdk run test
          pnpm --filter @aviation/g1000-protocols run test
          pnpm --filter @aviation/g1000-rendering run test
          pnpm --filter @aviation/ui-framework run test
          pnpm --filter @aviation/meta-app run test

  python:
    name: Python shared SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/legacy-project-wrapper/implementation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: components/legacy-project-wrapper/implementation/package.json
      - name: Build shared runtime providers for Python bindings
        run: |
          pnpm install --frozen-lockfile --filter @aviation/ai-explainer...
          pnpm --filter @aviation/shared-sdk run build
          pnpm --filter @aviation/keystore run build
          pnpm --filter @aviation/ai-explainer run build
      - name: Install common SDK packages and test runner
        run: python -m pip install -e packages/shared-sdk/python -e packages/flight-dynamics -e packages/g1000-avionics-sdk/python pytest httpx fastapi flask
      - name: Test common Python SDK and Component conformance
        run: |
          PYTHONPATH=packages/aviation-config/python python -m pytest packages/aviation-config/python/tests
          python -m pytest packages/keystore/python/tests
          python -m pytest packages/shared-sdk/python/tests
          python -m pytest packages/flight-dynamics/tests packages/flight-dynamics/test_api.py
          python -m pytest packages/g1000-avionics-sdk/python/tests

  clojure:
    name: JVM shared SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/legacy-project-wrapper/implementation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: components/legacy-project-wrapper/implementation/package.json
      - name: Build common broker for actual JVM RPC tests
        run: |
          pnpm install --frozen-lockfile --filter @aviation/ai-explainer...
          pnpm --filter @aviation/shared-sdk run build
          pnpm --filter @aviation/keystore run build
          pnpm --filter @aviation/ai-explainer run build
      - name: Install Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein -o "$RUNNER_TEMP/lein"
          chmod +x "$RUNNER_TEMP/lein"
          "$RUNNER_TEMP/lein" version
      - name: Test shared JVM policy and actual broker RPC
        working-directory: components/legacy-project-wrapper/implementation/packages/shared-sdk/clojure
        env:
          AVIATION_EXPLANATION_NODE_ENTRY: ${{ github.workspace }}/components/legacy-project-wrapper/implementation/packages/ai-explainer/dist/run.js
        run: |
          "$RUNNER_TEMP/lein" test

  go:
    name: Go shared packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/legacy-project-wrapper/implementation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: components/legacy-project-wrapper/implementation/go.mod
      - name: Test Go shared packages
        run: go test ./...
