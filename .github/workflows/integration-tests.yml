name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    continue-on-error: true  # integration test infrastructure not yet complete

    services:
      db:
        image: postgres:latest
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >
          --health-cmd "pg_isready -U user -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run integration tests
      run: |
        pytest tests/integration --junitxml=tests/integration/results/results.xml

    - name: Archive test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: tests/integration/results

    - name: Start Docker Compose
      run: |
        docker-compose -f docker-compose.cache.yml up -d
        docker-compose -f docker-compose.monitoring.yml up -d

    - name: Stop Docker Compose
      if: always()
      run: |
        docker-compose -f docker-compose.cache.yml down
        docker-compose -f docker-compose.monitoring.yml down
