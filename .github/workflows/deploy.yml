name: Build Aviation Deployment Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: Application image to build
        required: true
        default: all
        type: choice
        options:
          - all
          - aviation-accident-tracker
          - aviation-chat
          - aviation-missions-app
          - flight-planner
          - flight-track-analyzer
          - flight-tracker
          - flightschool
          - foreflight-dashboard
          - g1000-simulator
          - meta-app
          - preflight-check
          - weather-briefing

jobs:
  plan:
    name: Validate deployment manifest
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Check all application definitions
        run: python3 components/legacy-project-wrapper/implementation/deploy/deploy.py check
      - name: Check post-deployment E2E dispatch
        run: python3 -m unittest discover -s components/legacy-project-wrapper/implementation/deploy -p 'test_*.py'
      - name: Select images
        id: matrix
        env:
          SELECTED_APP: ${{ inputs.app || 'all' }}
        run: |
          python3 components/legacy-project-wrapper/implementation/deploy/deploy.py matrix --app "$SELECTED_APP" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.app }}
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag exact source revision
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long,prefix=sha-
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ./components/legacy-project-wrapper/implementation
          file: ./components/legacy-project-wrapper/implementation/apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
