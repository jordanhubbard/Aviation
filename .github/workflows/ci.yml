name: Monorepo CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

defaults:
  run:
    working-directory: components/legacy-project-wrapper/implementation

jobs:
  # Validate the sole task/execution contract.
  validate-mac:
    name: Validate MAC Repository Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install contract parser
        run: pip install PyYAML

      - name: Validate MAC contract
        run: make validate

      - name: Validate application state and credential contracts
        working-directory: .
        run: python scripts/check_application_state_contracts.py

      - name: Validate workspace package and build graph
        working-directory: .
        run: python scripts/check_workspace_package_graph.py

      - name: Validate repository harness classification
        working-directory: .
        run: python scripts/check_repository_harness_inventory.py

      - name: Validate retained wrapper remainder classification
        working-directory: .
        run: python scripts/check_retained_wrapper_remainder_inventory.py

  # Check accessibility and color contrast
  accessibility:
    name: Accessibility & Color Contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Check Color Contrast (WCAG AA)
        run: |
          chmod +x scripts/check-all-contrast.sh
          ./scripts/check-all-contrast.sh

  # Test aviation-missions-app
  test-missions-app:
    name: Test Aviation Missions App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java for Clojure
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Leiningen
        run: |
          wget https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein
          chmod +x lein
          sudo mv lein /usr/local/bin/
          lein version

      - name: Run backend tests
        working-directory: apps/aviation-missions-app/backend
        run: |
          lein deps
          lein test

  # Test flight-planner
  test-flight-planner:
    name: Test Flight Planner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Python dependencies
        working-directory: apps/flight-planner
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Python tests
        working-directory: apps/flight-planner
        run: |
          pytest --ignore=tests/integration_test.py --ignore=tests/test_integration.py
          pytest backend/tests

      # This frontend depends on workspace packages via the "workspace:" protocol,
      # which npm cannot resolve; install from the workspace root with pnpm.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --filter flight-planner-frontend...

      - name: Build shared SDK
        run: pnpm --filter @aviation/shared-sdk run build

      - name: Type check frontend
        run: pnpm --filter flight-planner-frontend run type-check

      - name: Lint frontend
        run: pnpm --filter flight-planner-frontend run lint

  # Test flightschool
  test-flightschool:
    name: Test Flight School
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: apps/flightschool
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: apps/flightschool
        run: pytest --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: apps/flightschool/coverage.xml
          flags: flightschool

  # Test foreflight-dashboard
  test-foreflight:
    name: Test ForeFlight Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Python dependencies
        working-directory: apps/foreflight-dashboard
        run: |
          pip install -r requirements.txt
          pip install -e ../../packages/shared-sdk/python
          pip install pytest pytest-cov

      - name: Run Python tests
        working-directory: apps/foreflight-dashboard
        run: pytest

      # Installed from the workspace root: this repo is a pnpm workspace and
      # no longer carries per-app npm lockfiles.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --filter foreflight-dashboard-frontend...

      - name: Build frontend
        run: pnpm --filter foreflight-dashboard-frontend run build

  test-flight-tracker:
    name: Test Flight Tracker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - name: Install tracking service and SDK dependencies
        run: pnpm install --frozen-lockfile --filter @aviation/flight-tracker...
      - name: Build tracking service and SDK dependencies
        run: pnpm --filter @aviation/flight-tracker... run build
      - name: Test service isolation and tracking lifecycle
        run: pnpm --filter @aviation/flight-tracker run test --runInBand
      - name: Build the isolated tracking qualification image
        run: docker build -f apps/flight-tracker/Dockerfile -t aviation-flight-tracker-e2e:lease .
      - name: Verify real controller-loss recovery and safe expired-resource cleanup
        env:
          AVIATION_E2E_LEASE_TEST_IMAGE: aviation-flight-tracker-e2e:lease
        run: python3 -m unittest discover -s deploy -p test_deploy.py

  # Lint and format check
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Enforce the currently clean ForeFlight frontend first. Additional apps
      # can be added as their existing lint debt is resolved.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Install ForeFlight frontend dependencies
        run: pnpm install --frozen-lockfile --filter foreflight-dashboard-frontend...

      - name: Lint ForeFlight frontend
        run: pnpm --filter foreflight-dashboard-frontend run lint

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  # Build check - ensure all apps can build
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [validate-mac, accessibility]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Set up pnpm
        # Version comes from the "packageManager" field in package.json; passing
        # a conflicting `version` input here makes action-setup fail.
        uses: pnpm/action-setup@v6

      - name: Verify monorepo Node.js structure
        run: pnpm install --ignore-scripts

      - name: Build status
        run: |
          echo "✅ All validation checks passed!"
          echo "📦 Applications are ready for deployment"

  # Performance Regression Checks
  performance-regression:
    name: Performance Regression Checks
    runs-on: ubuntu-latest
    needs: [build-check]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas matplotlib

      - name: Run performance regression checks
        run: |
          mkdir -p performance_metrics
          python scripts/performance_regression_checks.py

      - name: Store historical metrics
        run: |
          python scripts/store_historical_metrics.py

      - name: Fail on performance regressions
        if: failure()
        run: |
          echo "Performance regressions detected. Failing the CI."
          exit 1

  flight-track-analyzer:
    name: Flight Track Analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Start the isolated native test user manager
        run: |
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"

      - name: Test KML analysis, native hard-crash cleanup and airport touchdown evidence
        env:
          AVIATION_E2E_NATIVE_MANAGER_TESTS: '1'
        run: make -C apps/flight-track-analyzer test

  # Integration Tests (placeholder until monorepo-wide integration suite exists)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest pytest-cov

      - name: Run integration tests
        run: |
          # Monorepo-wide integration suite not yet configured; job is non-blocking
          echo "Integration tests placeholder (see apps/*/tests for per-app tests)."

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: |
            apps/*/tests/
            apps/*/logs/
