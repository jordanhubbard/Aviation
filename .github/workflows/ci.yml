name: Monorepo CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Validate the sole task/execution contract.
  validate-mac:
    name: Validate MAC Repository Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install contract parser
        run: pip install PyYAML

      - name: Validate MAC contract
        run: make validate

  # Check accessibility and color contrast
  accessibility:
    name: Accessibility & Color Contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Check Color Contrast (WCAG AA)
        run: |
          chmod +x scripts/check-all-contrast.sh
          ./scripts/check-all-contrast.sh

  # Test aviation-missions-app
  test-missions-app:
    name: Test Aviation Missions App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java for Clojure
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Leiningen
        run: |
          wget https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein
          chmod +x lein
          sudo mv lein /usr/local/bin/
          lein version

      - name: Run backend tests
        working-directory: apps/aviation-missions-app/backend
        run: |
          lein deps
          lein test

  # Test flight-planner
  test-flight-planner:
    name: Test Flight Planner
    runs-on: ubuntu-latest
    continue-on-error: true  # non-blocking: many test endpoints are stubs (return 404)
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Python dependencies
        working-directory: apps/flight-planner
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Python tests
        working-directory: apps/flight-planner
        run: pytest --ignore=tests/integration_test.py --ignore=tests/test_integration.py

      - name: Install frontend dependencies
        working-directory: apps/flight-planner/frontend
        run: npm ci

      - name: Type check frontend
        working-directory: apps/flight-planner/frontend
        run: npm run type-check

      - name: Lint frontend
        working-directory: apps/flight-planner/frontend
        run: npm run lint

  # Test flightschool
  test-flightschool:
    name: Test Flight School
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: apps/flightschool
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: apps/flightschool
        run: pytest --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          file: apps/flightschool/coverage.xml
          flags: flightschool

  # Test foreflight-dashboard
  test-foreflight:
    name: Test ForeFlight Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Python dependencies
        working-directory: apps/foreflight-dashboard
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Python tests
        working-directory: apps/foreflight-dashboard
        run: pytest

      - name: Install frontend dependencies
        working-directory: apps/foreflight-dashboard/frontend
        run: npm ci

      - name: Build frontend
        working-directory: apps/foreflight-dashboard/frontend
        run: npm run build

  # Lint and format check
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Enforce the currently clean ForeFlight frontend first. Additional apps
      # can be added as their existing lint debt is resolved.
      - name: Install ForeFlight frontend dependencies
        working-directory: apps/foreflight-dashboard/frontend
        run: npm ci

      - name: Lint ForeFlight frontend
        working-directory: apps/foreflight-dashboard/frontend
        run: |
          npm run lint

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  # Build check - ensure all apps can build
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [validate-mac, accessibility]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Verify monorepo Node.js structure
        run: pnpm install --ignore-scripts

      - name: Build status
        run: |
          echo "✅ All validation checks passed!"
          echo "📦 Applications are ready for deployment"

  # Performance Regression Checks
  performance-regression:
    name: Performance Regression Checks
    runs-on: ubuntu-latest
    needs: [build-check]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas matplotlib

      - name: Run performance regression checks
        run: |
          mkdir -p performance_metrics
          python scripts/performance_regression_checks.py

      - name: Store historical metrics
        run: |
          python scripts/store_historical_metrics.py

      - name: Fail on performance regressions
        if: failure()
        run: |
          echo "Performance regressions detected. Failing the CI."
          exit 1

  # Integration Tests (placeholder until monorepo-wide integration suite exists)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest pytest-cov

      - name: Run integration tests
        run: |
          # Monorepo-wide integration suite not yet configured; job is non-blocking
          echo "Integration tests placeholder (see apps/*/tests for per-app tests)."

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: |
            apps/*/tests/
            apps/*/logs/
