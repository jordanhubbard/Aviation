version: '3.8'
services:
  backend-test:
    build:
      context: ./backend
    command: pytest
    environment:
      - NODE_ENV=test
    volumes:
      - ./backend:/app
    depends_on:
      - db
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data: