# G1000 Configuration
# Define G1000 settings including version, display, and features

version: "NXi"
display:
  size: "10.4 inch"
  resolution: "1024x768"
features:
  svt: true
  charts: true
  weather: true
  traffic: true
nav_com:
  radio_definitions:
    - name: "NAV1"
      frequency_range: "108.00-117.95"
    - name: "COM1"
      frequency_range: "118.00-136.975"
