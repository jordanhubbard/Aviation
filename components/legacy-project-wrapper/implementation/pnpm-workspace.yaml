packages:
  - "packages/*"
  - "apps/*"
  # Nested app workspaces. Globbed rather than listed individually so a new
  # frontend/backend is picked up automatically; previously flight-planner and
  # aviation-missions-app frontends were omitted and never had deps installed.
  - "apps/*/frontend"
  - "apps/*/backend"
pmOnFail: ignore
allowBuilds:
  '@apollo/protobufjs': true
  '@scarf/scarf': false
  '@vscode/sqlite3': true
  esbuild: true
  msw: true
  unrs-resolver: true

# Security overrides for Trivy HIGH/CRITICAL findings. Scoped where a global
# override would force a breaking major bump (react-router v7 only).
overrides:
  "@protobufjs/utf8": "1.1.1"
  "@graphql-tools/utils": "12.0.2"
  "body-parser@1": "1.20.9"
  "body-parser@2": "2.4.0"
  follow-redirects: "1.16.2"
  ip-address: "10.7.4"
  proxy-addr: "2.0.8"
  qs: "6.16.0"
  "uuid@11": "11.1.1"
  "uuid@13": "13.0.1"
  ws: "8.22.0"
  "react-router@7": "7.18.4"
  "react-router-dom@7": "7.18.4"
