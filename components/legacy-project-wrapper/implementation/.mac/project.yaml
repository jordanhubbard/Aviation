schema: mac.repository_contract.v1
project: Aviation
canonical_remote_url: git@github.com:jordanhubbard/Aviation.git
platforms:
  - darwin
  - linux
toolchain:
  # pnpm is provisioned by corepack from the packageManager pin rather than
  # installed globally; the Clojure app builds and tests inside Docker, so lein
  # and a local JDK are not preconditions.
  required_commands:
    - git
    - python3
    - node
    - corepack
    - docker
bootstrap:
  command: corepack pnpm install
  creates:
    - node_modules
test:
  command: make test
evidence:
  required:
    - repo.head_sha
    - repo.pushed
    - repo.dirty
    - repo.files_changed
    - tests
