[build]
builder = "DOCKERFILE"
# Path is relative to the repo root, which is the build context the Dockerfile
# now needs in order to resolve pnpm workspace packages.
dockerfilePath = "apps/g1000-simulator/Dockerfile"

[deploy]
startCommand = ""
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
PORT = "8000"
